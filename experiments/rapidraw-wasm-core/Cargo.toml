[package]
name = "cw-rapidraw-wasm-probe"
version = "0.0.0"
edition = "2024"
license = "AGPL-3.0-only"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
# Only the reproducibly prepared timer-patched staging tree supplies its marker.
quality-timer-compat = []

[dependencies]
rayon = "=1.12.0"
glam = "=0.33.5"
serde = { version = "=1.0.229", features = ["derive"] }
rawler = { git = "https://github.com/CyberTimon/RapidRAW-DngLab.git", rev = "a32bc1ff1f4f3c56d4d3226082f6eb17414f9159" }
bytemuck = { version = "=1.25.2", features = ["derive"] }
sha2 = "0.10.9"
log = "0.4"
serde_json = "=1.0.151"
image = { version = "=0.25.10", default-features = false, features = ["png"] }
imageproc = { version = "=0.27.0", default-features = false }
crc32fast = "=1.5.0"
half = "=2.7.1"
mozjpeg-rs = "=0.9.2"
imgref = "=1.12.2"
rgb = "=0.8.53"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.115"
uuid = { version = "1", features = ["js"] }
js-sys = "0.3.82"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
anyhow = "1.0.104"
