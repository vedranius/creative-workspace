      - 'scripts/verify-rapidraw-export-settings-native.mjs'
      - 'scripts/verify-rapidraw-export-fine-native.mjs'
      - 'scripts/smoke-rapidraw-preview.mjs'
      - 'patches/rapidraw-rawler/**'
      - 'scripts/prepare-rapidraw-quality.mjs'
      - 'scripts/smoke-rapidraw-development.mjs'
      - 'scripts/smoke-rapidraw-exposure-pixels.mjs'
      - 'scripts/smoke-rapidraw-ui-exposure.mjs'
      - 'scripts/smoke-rapidraw-camera-exposure.mjs'
      - 'scripts/smoke-rapidraw-as-shot.mjs'
      - 'scripts/smoke-rapidraw-webgpu.mjs'
      - 'scripts/smoke-rapidraw-png.mjs'
      - 'scripts/ci-rapidraw-pixel-parity.mjs'
      - 'docs/evidence/rapidraw-wasm/runtime-smoke.json'
      - '.github/workflows/rapidraw-pixel-parity.yaml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pixel-parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/setup-ci-rust.mjs 1.99.0 --wasm
      - run: cargo install wasm-bindgen-cli --version 0.2.129 --locked
      - run: npm ci
      - run: npm install --no-save --package-lock=false playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - name: Verify RapidRAW browser WebGPU host boundary
        run: node --test experiments/rapidraw-wasm-core/decoder-client.test.mjs experiments/rapidraw-wasm-core/webgpu-renderer.test.mjs experiments/rapidraw-wasm-core/react-transport.test.mjs experiments/rapidraw-wasm-core/export-client.test.mjs experiments/rapidraw-wasm-core/export-destination.test.mjs experiments/rapidraw-wasm-core/settings-storage.test.mjs experiments/rapidraw-wasm-core/preset-file.test.mjs experiments/rapidraw-wasm-core/preset-library.test.mjs experiments/rapidraw-wasm-core/metadata-storage.test.mjs
      - name: Check original metadata action proof syntax
        run: |
          node --check scripts/build-rapidraw-react-proof.mjs
          node --check scripts/smoke-rapidraw-metadata-selection.mjs
          node --check scripts/smoke-rapidraw-metadata-filmstrip.mjs
          node --check scripts/smoke-rapidraw-settings-initialization.mjs
          node --check scripts/smoke-rapidraw-copy-paste-settings.mjs
          node --check scripts/smoke-rapidraw-metadata-copy-paste.mjs
          node --check scripts/verify-rapidraw-copy-paste-native.mjs
      - name: Configure pinned Playwright Chromium
        run: node -e 'require("node:fs").appendFileSync(process.env.GITHUB_ENV, "CHROMIUM_PATH="+require("playwright").chromium.executablePath()+"\n")'
      - name: Reproduce native, Quality WASM, and Speed WASM pixels
        run: node scripts/ci-rapidraw-pixel-parity.mjs artifacts/rapidraw-pixel-parity
        env:
          PLAYWRIGHT_MODULE: playwright
          CHROMIUM_SANDBOX: 'false'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rapidraw-pixel-parity-${{ github.run_id }}
          path: artifacts/rapidraw-pixel-parity/
          if-no-files-found: warn
          retention-days: 30
