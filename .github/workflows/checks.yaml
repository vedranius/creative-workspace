name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: node --check scripts/verify-designcraft-endnote-target.mjs
      - run: node scripts/verify-designcraft-endnote-target.mjs
        env:
          PROVENANCE_ONLY: '1'
      - run: npm run check
      - run: npm test
