name: Build and release
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'evidence/**'
      - 'patches/**'
      - 'README.md'
      - 'LICENSE.md'
      - 'CHANGELOG.md'
      - 'release/config.json'
      - '.github/workflows/release.yaml'
      - '.github/workflows/artcraft-demo.yaml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: creative-workspace-release
  cancel-in-progress: false
jobs:
  contract:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run check
      - run: npm test
      - id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node scripts/release.mjs validate)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # Published versions are immutable. A forgotten bump stops before builds.
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$VERSION" >/dev/null 2>&1; then
            echo "Version v$VERSION already exists; bump version and changelog." >&2
            exit 1
          fi
  native:
    needs: contract
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        platform:
          - {runner: ubuntu-22.04, target: linux-x64}
          - {runner: windows-2022, target: win32-x64}
          - {runner: macos-14, target: darwin-arm64}
        engine: [photocraft, pdfcraft, vectorcraft, designcraft]
    runs-on: ${{ matrix.platform.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Set up pinned native Rust
        run: node scripts/setup-ci-rust.mjs 1.95.0
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake pkg-config libfontconfig1-dev libfreetype6-dev libssl-dev
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            build/runtime/${{ matrix.engine }}/build
          key: native-${{ matrix.platform.target }}-${{ matrix.engine }}-${{ hashFiles('engines/**/manifest.json', 'engines/**/native/**', 'scripts/manage-*.mjs') }}-rust195
          restore-keys: native-${{ matrix.platform.target }}-${{ matrix.engine }}-
      - run: npm ci
      - name: Build independently pinned native engine
        run: node scripts/release.mjs engine ${{ matrix.engine }}
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.platform.target }}-${{ matrix.engine }}
          path: build/staged/${{ matrix.engine }}/
          if-no-files-found: error
          retention-days: 7
  original-filmcraft:
    needs: contract
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Set up pinned Rust and WebAssembly target
        run: node scripts/setup-ci-rust.mjs 1.99.0 --wasm
      - id: filmcraft-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/wasm-bindgen
            build/original-ui/target
          key: filmcraft-original-wasm-rust199-bindgen129-${{ hashFiles('engines/original-ui/filmcraft/**') }}
          restore-keys: filmcraft-original-wasm-rust199-bindgen129-
      - run: npm ci
      - name: Fetch only the contracted original source revision
        shell: bash
        run: |
          mkdir -p build/original-ui/source-filmcraft
          git -C build/original-ui/source-filmcraft init
          git -C build/original-ui/source-filmcraft remote add origin https://github.com/storytold/filmcraft.git
          git -C build/original-ui/source-filmcraft fetch --depth=1 origin 4e2d0bc2d3646f9cf27ef7aa8b2095c6858c7efe
          git -C build/original-ui/source-filmcraft checkout --detach FETCH_HEAD
          if ! wasm-bindgen --version | grep -q '^wasm-bindgen 0.2.129$'; then
            cargo install wasm-bindgen-cli --version 0.2.129 --locked --force
          fi
      - name: Build and register reviewed original FilmCraft UI variant
        run: npm run ui:filmcraft:build
      - name: Original browser MKV pending-read regression
        shell: bash
        env:
          CW_PLAYWRIGHT_MODULE: file://${{ github.workspace }}/build/browser-qa/node_modules/playwright/index.mjs
          CW_ORIGINAL_UI_DIR: build/original-ui/packages
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          npm install --prefix build/browser-qa --no-audit --no-fund --save-exact playwright@1.64.0
          (cd build/browser-qa && npx playwright install --with-deps chromium)
          node scripts/smoke-filmcraft-mkv.mjs
      - name: Preserve pinned compile cache after a later QA/registration failure
        if: always() && steps.filmcraft-cache.outputs.cache-primary-key != '' && steps.filmcraft-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/wasm-bindgen
            build/original-ui/target
          key: ${{ steps.filmcraft-cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: filmcraft-original-ui-evidence
          path: build/filmcraft-mkv-evidence/
          if-no-files-found: warn
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: release-filmcraft-original-ui
          path: dist/*
          if-no-files-found: error
          retention-days: 30
  original-designcraft:
    needs: [contract, native]
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Set up pinned Rust and WebAssembly target
        run: node scripts/setup-ci-rust.mjs 1.99.0 --wasm
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            build/original-ui/target
          key: designcraft-par03-wasm-rust199-${{ hashFiles('patches/designcraft/a127c6d5/par-03-save-recovery-v1.patch') }}
      - name: Install checksum-pinned Trunk
        shell: bash
        run: |
          curl -fsSLo "$RUNNER_TEMP/trunk.tar.gz" https://github.com/trunk-rs/trunk/releases/download/v0.21.14/trunk-x86_64-unknown-linux-gnu.tar.gz
          echo 'f2b4680cd239693a646a2795e4633c625328d7b2a044fbe749fa3a2fe9e7036b  trunk.tar.gz' | (cd "$RUNNER_TEMP" && sha256sum -c -)
          tar -xzf "$RUNNER_TEMP/trunk.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - run: npm ci
      - name: Install the isolated Linux on-demand provider helper
        env:
          CW_STORAGE_RUNTIME: ${{ github.workspace }}/build/storage-runtime
        run: |
          sudo apt-get update && sudo apt-get install -y fuse3
          npm run storage:install
      - name: Fetch pinned DesignCraft source and Linux worker
        shell: bash
        run: |
          mkdir -p build/original-ui/source-designcraft
          git -C build/original-ui/source-designcraft init
          git -C build/original-ui/source-designcraft remote add origin https://github.com/storytold/designcraft.git
          git -C build/original-ui/source-designcraft fetch --depth=1 origin a127c6d5c3576972bbd60445f26d893db071eef3
          git -C build/original-ui/source-designcraft checkout --detach FETCH_HEAD
          mkdir -p build/staged/designcraft
      - uses: actions/download-artifact@v4
        with:
          name: native-linux-x64-designcraft
          path: build/staged/designcraft
      - name: Build/register the reviewed original UI variant
        run: node scripts/build-designcraft-par03-ui.mjs build/original-ui/source-designcraft build/original-ui/assets-designcraft build/original-ui/packages
      - name: Verify original Pages selection waits for matching bounded ACK
        env:
          CARGO_BUILD_JOBS: '1'
        run: cargo test --manifest-path build/original-ui/source-designcraft/Cargo.toml -p designcraft-ui-egui original_page_selection_waits_for_matching_bounded_ack
      - name: Verify original Selection Tool and Type Tool actions against the server worker
        env:
          CARGO_BUILD_JOBS: '1'
        run: cargo test --manifest-path build/original-ui/source-designcraft/Cargo.toml -p designcraft-ui-egui original_text_selection_and_caret_actions_keep_fifo_order_with_typing
      - name: Verify original Edit > Select All waits for the server action ACK
        env:
          CARGO_BUILD_JOBS: '1'
        run: cargo test --manifest-path build/original-ui/source-designcraft/Cargo.toml -p designcraft-ui-egui original_edit_select_all_waits_for_worker_ack
      - name: Verify original Edit > Deselect All waits for the server action ACK
        env:
          CARGO_BUILD_JOBS: '1'
        run: cargo test --manifest-path build/original-ui/source-designcraft/Cargo.toml -p designcraft-ui-egui original_edit_deselect_all_waits_for_worker_ack
      - name: Verify selected-page pointer geometry and original second-spread Type Tool hit
        env:
          CARGO_BUILD_JOBS: '1'
        run: cargo test --manifest-path build/original-ui/source-designcraft/Cargo.toml -p designcraft-ui-egui host_page_pointer
      - name: Verify original Edit > Clear waits for the server action ACK
        env:
          CARGO_BUILD_JOBS: '1'
        run: cargo test --manifest-path build/original-ui/source-designcraft/Cargo.toml -p designcraft-ui-egui original_edit_clear_waits_for_worker_ack_before_hydrating
      - name: Verify original Text Tool deletion waits for the server action ACK
        env:
          CARGO_BUILD_JOBS: '1'
        run: cargo test --manifest-path build/original-ui/source-designcraft/Cargo.toml -p designcraft-ui-egui original_text_delete_waits_for_worker_ack_before_hydrating
      - name: Verify original Text Tool deletion stages the upstream command ID
        env:
          CARGO_BUILD_JOBS: '1'
        run: cargo test --manifest-path build/original-ui/source-designcraft/Cargo.toml -p designcraft-engine server_mirror_stages_original_text_delete_id_and_params_without_local_mutation
      - name: Verify original Layout > Pages > Delete Page waits for server ACK
        env:
          CARGO_BUILD_JOBS: '1'
        run: cargo test --manifest-path build/original-ui/source-designcraft/Cargo.toml -p designcraft-ui-egui original_delete_page_queues_engine_command_and_hydrates_only_after_ack
      - name: Verify original Pages drag waits for its matching server ACK
        env:
          CARGO_BUILD_JOBS: '1'
        run: |
          cargo test --manifest-path build/original-ui/source-designcraft/Cargo.toml -p designcraft-ui-egui original_page_move_waits_for_matching_ack_and_preserves_page_identity
          mkdir -p build/designcraft-par03-evidence
          CW_DESIGNCRAFT_CELL_FIXTURE="$PWD/build/designcraft-par03-evidence/cell-fixture.designcraft" cargo test --manifest-path build/original-ui/source-designcraft/Cargo.toml -p cw-designcraft-engine
      - name: Verify the original UI against the owned server worker
        env:
          CW_DESIGNCRAFT_BINARY: ${{ github.workspace }}/build/staged/designcraft/cw-designcraft-engine
          CW_DESIGNCRAFT_UI_ASSETS: ${{ github.workspace }}/build/original-ui/assets-designcraft
          CW_FUSE_BINARY: ${{ github.workspace }}/build/storage-runtime/build/release/cw-filesystem-helper
          CW_ORIGINAL_UI_DIR: ${{ github.workspace }}/build/original-ui/packages
          CW_PLAYWRIGHT_MODULE: file://${{ github.workspace }}/build/browser-qa/node_modules/playwright/index.mjs
          CW_PAR03_SCREENSHOT: ${{ github.workspace }}/build/designcraft-par03-evidence/browser.png
          CW_PAR03_REPORT: ${{ github.workspace }}/build/designcraft-par03-evidence/report.json
          CW_PAR03_FILE_NEW_SCREENSHOT: ${{ github.workspace }}/build/designcraft-par03-evidence/file-new-browser.png
          CW_PAR03_FILE_NEW_REPORT: ${{ github.workspace }}/build/designcraft-par03-evidence/file-new-browser.json
          CW_PAR03_TEXT_REPORT: ${{ github.workspace }}/build/designcraft-par03-evidence/selection-text-actions.json
          CW_PAR03_SELECT_ALL_SCREENSHOT: ${{ github.workspace }}/build/designcraft-par03-evidence/select-all-browser.png
          CW_PAR03_SELECT_ALL_REPORT: ${{ github.workspace }}/build/designcraft-par03-evidence/select-all-browser.json
          CW_PAR03_EDIT_CLEAR_REPORT: ${{ github.workspace }}/build/designcraft-par03-evidence/edit-clear-browser.json
          CW_PAR03_EDIT_CLEAR_SCREENSHOT: ${{ github.workspace }}/build/designcraft-par03-evidence/edit-clear-browser.png
          CW_PAR03_EDIT_CLEAR_MENU_SCREENSHOT: ${{ github.workspace }}/build/designcraft-par03-evidence/edit-clear-menu-browser.png
          CW_PAR03_TEXT_DELETE_REPORT: ${{ github.workspace }}/build/designcraft-par03-evidence/text-delete-browser.json
          CW_PAR03_TEXT_DELETE_SCREENSHOT: ${{ github.workspace }}/build/designcraft-par03-evidence/text-delete-browser.png
          CW_DESIGNCRAFT_RECOVERY_REPORT: ${{ github.workspace }}/build/designcraft-par03-evidence/recovery-entry-browser.json
          CW_DESIGNCRAFT_RECOVERY_SCREENSHOT: ${{ github.workspace }}/build/designcraft-par03-evidence/recovery-entry-browser.png
          CW_DESIGNCRAFT_ACK_FAILURE_REPORT: ${{ github.workspace }}/build/designcraft-par03-evidence/save-copy-ack-failure-browser.json
          CW_DESIGNCRAFT_ACK_FAILURE_SCREENSHOT: ${{ github.workspace }}/build/designcraft-par03-evidence/save-copy-ack-failure-browser.png
          CW_DESIGNCRAFT_ACK_FAILURE_RECOVERY_SCREENSHOT: ${{ github.workspace }}/build/designcraft-par03-evidence/save-copy-ack-failure-recovery.png
          CW_PAR03_PAGES_SELECT_REPORT: ${{ github.workspace }}/build/designcraft-par03-evidence/pages-select-browser.json
          CW_PAR03_PAGES_SELECT_SCREENSHOT: ${{ github.workspace }}/build/designcraft-par03-evidence/pages-select-browser.png
          CW_PAR03_ACK_OBSERVER_DELAY_MS: '750'
          CW_PAR03_SECOND_PAGE_TEXT_REPORT: ${{ github.workspace }}/build/designcraft-par03-evidence/second-page-text-browser.json
          CW_PAR03_SECOND_PAGE_TEXT_SCREENSHOT: ${{ github.workspace }}/build/designcraft-par03-evidence/second-page-text-browser.png
          CW_PAR03_FACING_PAGE_TEXT_REPORT: ${{ github.workspace }}/build/designcraft-par03-evidence/facing-page-text-browser.json
          CW_PAR03_FACING_PAGE_TEXT_SCREENSHOT: ${{ github.workspace }}/build/designcraft-par03-evidence/facing-page-text-browser.png
          CW_PAR03_PAGES_MOVE_REPORT: ${{ github.workspace }}/build/designcraft-par03-evidence/pages-move-browser.json
          CW_PAR03_PAGES_MOVE_SCREENSHOT: ${{ github.workspace }}/build/designcraft-par03-evidence/pages-move-browser.png
          CW_PAR03_DELETE_PAGE_REPORT: ${{ github.workspace }}/build/designcraft-par03-evidence/delete-page-browser.json
          CW_PAR03_DELETE_PAGE_SCREENSHOT: ${{ github.workspace }}/build/designcraft-par03-evidence/delete-page-browser.png
          CW_PAR03_DELETE_PAGE_MENU_SCREENSHOT: ${{ github.workspace }}/build/designcraft-par03-evidence/delete-page-menu.png
        run: |
          chmod +x "$CW_DESIGNCRAFT_BINARY"
          npm install --prefix build/browser-qa --no-audit --no-fund --save-exact playwright@1.64.0
          (cd build/browser-qa && npx playwright install --with-deps chromium)
          node scripts/smoke-designcraft-file-new-browser.mjs
          CW_DESIGNCRAFT_UI_ASSETS=build/original-ui/assets-designcraft CW_PAR03_TEXT_REPORT=build/designcraft-par03-evidence/selection-text-actions.json node scripts/smoke-designcraft-text-insert-candidate.mjs
          node scripts/smoke-designcraft-select-all-candidate.mjs
          node scripts/smoke-designcraft-edit-clear-candidate.mjs
          node scripts/smoke-designcraft-text-delete-candidate.mjs
          node scripts/smoke-designcraft-recovery-entry.mjs
          node scripts/smoke-designcraft-save-copy-ack-failure.mjs
          node scripts/smoke-designcraft-delete-page-browser.mjs
          node scripts/smoke-designcraft-pages-move-browser.mjs
          node scripts/smoke-designcraft-pages-select-browser.mjs
          node scripts/smoke-designcraft-second-page-text-browser.mjs
          node docs/evidence/designcraft-facing-page-text-browser.mjs
          CW_PAR03_CARET_REPORT=build/designcraft-par03-evidence/caret-browser.json CW_PAR03_CARET_SCREENSHOT=build/designcraft-par03-evidence/caret-browser.png node scripts/smoke-designcraft-caret-browser.mjs
          CW_PAR03_SELECTION_REPORT=build/designcraft-par03-evidence/text-selection-browser.json CW_PAR03_SELECTION_SCREENSHOT=build/designcraft-par03-evidence/text-selection-browser.png node scripts/smoke-designcraft-text-selection-browser.mjs
          CW_PAR03_WORK_ROOT=build/host-tmp/designcraft-cell-selection CW_DESIGNCRAFT_CELL_FIXTURE=build/designcraft-par03-evidence/cell-fixture.designcraft CW_PAR03_CELL_REPORT=build/designcraft-par03-evidence/cell-browser.json CW_PAR03_CELL_SCREENSHOT=build/designcraft-par03-evidence/cell-browser.png node scripts/smoke-designcraft-cell-selection-browser.mjs
      - name: Build and prove the original preset/server-canvas candidate
        env:
          CW_DESIGNCRAFT_BINARY: ${{ github.workspace }}/build/staged/designcraft/cw-designcraft-engine
          CW_DESIGNCRAFT_UI_ASSETS: ${{ github.workspace }}/build/original-ui/assets-designcraft-host
          CW_PLAYWRIGHT_MODULE: ${{ github.workspace }}/build/browser-qa/node_modules/playwright/index.mjs
          CW_FUSE_BINARY: ${{ github.workspace }}/build/storage-runtime/build/release/cw-filesystem-helper
          CW_PAR03_SCREENSHOT: ${{ github.workspace }}/build/designcraft-par03-evidence/host-canvas.png
          CW_PAR03_REPORT: ${{ github.workspace }}/build/designcraft-par03-evidence/host-canvas.json
          CW_PAR03_SAVE_DIALOG: ${{ github.workspace }}/build/designcraft-par03-evidence/server-save-copy.png
          CW_PAR03_SAVE_DESTINATION_DIALOG: ${{ github.workspace }}/build/designcraft-par03-evidence/server-save-destination.png
          CW_PAR03_LAPTOP_DESTINATION_DIALOG: ${{ github.workspace }}/build/designcraft-par03-evidence/laptop-save-destination.png
        run: |
          git clone --shared --no-checkout build/original-ui/source-designcraft build/original-ui/source-designcraft-host
          git -C build/original-ui/source-designcraft-host checkout --detach a127c6d5c3576972bbd60445f26d893db071eef3
          node scripts/build-designcraft-host-ui.mjs
          CW_PAR03_SCREENSHOT="$GITHUB_WORKSPACE/build/designcraft-par03-evidence/file-open.png" CW_PAR03_REPORT="$GITHUB_WORKSPACE/build/designcraft-par03-evidence/file-open.json" node scripts/smoke-designcraft-file-open-candidate.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: designcraft-par03-browser-evidence
          path: build/designcraft-par03-evidence/
          if-no-files-found: warn
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: release-designcraft-par03-ui
          path: dist/*
          if-no-files-found: error
          retention-days: 30
  bundle:
    needs: [contract, native]
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        platform:
          - {runner: ubuntu-22.04, target: linux-x64}
          - {runner: windows-2022, target: win32-x64}
          - {runner: macos-14, target: darwin-arm64}
    runs-on: ${{ matrix.platform.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          pattern: native-${{ matrix.platform.target }}-*
          path: build/downloaded
      - name: Restore independently built engines
        shell: bash
        run: |
          mkdir -p build/staged
          for ENGINE in photocraft pdfcraft vectorcraft designcraft; do
            mv "build/downloaded/native-${{ matrix.platform.target }}-$ENGINE" "build/staged/$ENGINE"
          done
      - run: node scripts/release.mjs bundle
      - name: Bundled Node and actual native open/edit/save/reopen
        run: node scripts/release.mjs smoke
      - run: node scripts/release.mjs archive
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30
  original-wordcraft:
    needs: contract
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Set up pinned Rust and WebAssembly target
        run: node scripts/setup-ci-rust.mjs 1.99.0 --wasm
      - id: wordcraft-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/wasm-bindgen
            build/original-ui/target
          key: wordcraft-original-wasm-rust199-bindgen129-${{ hashFiles('src/original-ui.js') }}
          restore-keys: wordcraft-original-wasm-rust199-bindgen129-
      - run: npm ci
      - name: Install checksum-pinned Trunk
        shell: bash
        run: |
          curl -fsSLo "$RUNNER_TEMP/trunk.tar.gz" https://github.com/trunk-rs/trunk/releases/download/v0.21.14/trunk-x86_64-unknown-linux-gnu.tar.gz
          echo 'f2b4680cd239693a646a2795e4633c625328d7b2a044fbe749fa3a2fe9e7036b  trunk.tar.gz' | (cd "$RUNNER_TEMP" && sha256sum -c -)
          tar -xzf "$RUNNER_TEMP/trunk.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Fetch only the contracted original source revision
        shell: bash
        run: |
          mkdir -p build/original-ui/source-wordcraft
          git -C build/original-ui/source-wordcraft init
          git -C build/original-ui/source-wordcraft remote add origin https://github.com/storytold/wordcraft.git
          git -C build/original-ui/source-wordcraft fetch --depth=1 origin fc41918814f62645b6746ed68e71e8c2c2e85d6f
          git -C build/original-ui/source-wordcraft checkout --detach FETCH_HEAD
          if ! wasm-bindgen --version | grep -q '^wasm-bindgen 0.2.129$'; then
            cargo install wasm-bindgen-cli --version 0.2.129 --locked --force
          fi
      - name: Build and register the pinned original WordCraft browser UI
        run: nice -n 10 npm run ui:wordcraft:build -- build/original-ui/source-wordcraft build/original-ui/assets-wordcraft build/original-ui/packages
      - name: Preserve pinned compile cache after later failure
        if: always() && steps.wordcraft-cache.outputs.cache-primary-key != '' && steps.wordcraft-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/wasm-bindgen
            build/original-ui/target
          key: ${{ steps.wordcraft-cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v4
        with:
          name: release-wordcraft-original-ui
          path: dist/*
          if-no-files-found: error
          retention-days: 30
  original-gridcraft:
    needs: contract
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Set up pinned Rust and WebAssembly target
        run: node scripts/setup-ci-rust.mjs 1.99.0 --wasm
      - id: gridcraft-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/wasm-bindgen
            build/original-ui/target
          key: gridcraft-original-wasm-rust199-bindgen129-${{ hashFiles('src/original-ui.js') }}
          restore-keys: gridcraft-original-wasm-rust199-bindgen129-
      - run: npm ci
      - name: Install checksum-pinned Trunk
