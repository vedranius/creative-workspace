  publish:
    needs: [contract, bundle, original-filmcraft, original-designcraft, original-wordcraft, original-gridcraft, original-deckcraft, original-cadcraft, original-figcraft, original-soundcraft]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Verify complete release and create notes
        run: |
          node scripts/release.mjs notes release-notes.md
          cd dist
          sha256sum -c *.sha256
          test "$(find . -name '*.sha256' | wc -l)" -eq 12
      - name: Publish verified alpha through GitHub Actions
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.contract.outputs.version }}
        run: |
          gh release create "v$VERSION" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft --prerelease --title "Creative Workspace $VERSION (alpha)" --notes-file release-notes.md
          test "$(gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets | length')" -eq 24
          # A draft release alone does not create its immutable Git tag.
          git tag "v$VERSION" "$GITHUB_SHA"
          git push origin "refs/tags/v$VERSION"
          if node -e "process.exit(JSON.parse(require('fs').readFileSync('release/config.json')).draftOnly ? 1 : 0)"; then
            gh release edit "v$VERSION" --repo "$GITHUB_REPOSITORY" --draft=false
          else
            echo "Release assets verified; draft retained pending original-UI bundle evidence."
          fi
